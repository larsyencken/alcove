name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # "locked" tests what uv.lock pins; "latest" re-resolves every dependency
    # to its newest allowed version, which is what a fresh install gets;
    # "lowest" holds our direct dependencies at the floors in pyproject.toml
    # (or above, where a dev dependency needs more). The resolution mode is set
    # as an env var rather than a `uv sync` flag, since a later `uv run` in
    # another mode re-resolves and installs the newest versions again
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: locked
            sync-args: ""
            resolution: highest
            make-target: test
          - deps: latest
            sync-args: --upgrade
            resolution: highest
            make-target: unittest
          - deps: lowest
            sync-args: ""
            resolution: lowest-direct
            make-target: unittest

    name: build (${{ matrix.deps }} deps)

    env:
      UV_RESOLUTION: ${{ matrix.resolution }}

    services:
      minio:
        image: lazybit/minio
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: justtesting
          MINIO_SECRET_KEY: justtesting

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
          enable-plugins: nu_plugin_polars

      - name: Install dependencies
        run: uv sync ${{ matrix.sync-args }}

      # `uv run` first, so this lists what the tests will actually run against
      - name: Show resolved versions
        run: uv run true && uv pip list

      - name: Set up testing minio bucket
        run: |
          .venv/bin/python3 - <<'EOF'
          from minio import Minio

          minio = Minio(
              'localhost:9000',
              access_key='justtesting',
              secret_key='justtesting',
              secure=False
          )

          minio.make_bucket('test')
          print(f'{minio.list_buckets()}')
          EOF

      # other ruff and pyright versions bring other rules, which say nothing
      # about whether alcove still works, so only lint against the lockfile
      - name: Run tests
        run: make ${{ matrix.make-target }}
        env:
          B2_APPLICATION_KEY: justtesting
          B2_APPLICATION_KEY_ID: justtesting
          B2_BUCKET_NAME: test
          B2_ENDPOINT_URL: http://localhost:9000/
